# =====================================================================
# nginx — sert le front Angular et relaie l'API
#
# Une seule origine pour le navigateur : les fichiers statiques et l'API sont
# derrière ce même serveur. C'est ce qui permet à environment.prod.ts d'utiliser
# une apiUrl vide, et ce qui rend toute configuration CORS inutile.
# =====================================================================

upstream backend {
    # "spring" est le nom du service dans docker-compose.yml ; le DNS interne de
    # Docker le résout. 8080 est le port par défaut de Spring Boot : le projet ne
    # définit ni server.port ni context-path.
    server spring:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le backend accepte des fichiers de 10 Mo (requête totale 12 Mo). La limite
    # nginx par défaut est de 1 Mo : sans cette ligne, le téléversement d'une
    # photo échouerait en 413 avant même d'atteindre Spring.
    client_max_body_size 12m;

    # En-têtes de sécurité de base. Pas de HSTS : le déploiement est en HTTP sur
    # le réseau local, un HSTS y bloquerait l'accès sans apporter de protection.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La génération de PDF et l'import CSV peuvent dépasser la minute par
        # défaut sur un Mini PC ; une coupure à mi-parcours laisserait
        # l'utilisateur sans réponse alors que le traitement a bien eu lieu.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Réponses transmises au fur et à mesure : utile pour les PDF et les
        # exports, qui n'ont pas à être stockés en tampon avant envoi.
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Photos
    # ------------------------------------------------------------------
    # ImageController expose GET /personne/{fichier} et WebConfig y associe un
    # gestionnaire de ressources : ce chemin est hors /api et doit être relayé
    # explicitement, sans quoi toutes les photos renverraient le index.html du
    # front (donc une image cassée).
    location /personne/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------------
    # Fichiers statiques
    # ------------------------------------------------------------------
    # index.html ne doit jamais être mis en cache : il référence les bundles par
    # empreinte, un index périmé pointerait vers des fichiers supprimés et
    # laisserait une page blanche après mise à jour.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Les bundles portent une empreinte dans leur nom (outputHashing: all) : leur
    # contenu ne change jamais à nom constant, ils peuvent donc être cachés
    # longuement.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute route inconnue est rendue par Angular. Sans
    # cette bascule, un rafraîchissement (F5) sur /students renverrait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
