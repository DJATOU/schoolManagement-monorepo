<div class="datatable-toolbar">
  <div class="toolbar-actions">
    <button mat-flat-button class="dt-btn dt-create" (click)="onCreate()">
      <mat-icon>add</mat-icon>
      {{ 'DATATABLE.CREATE' | translate }}
    </button>
    <button mat-stroked-button class="dt-btn" (click)="onPrint()">
      <mat-icon>print</mat-icon>
      {{ 'DATATABLE.PRINT' | translate }}
    </button>
    <button mat-stroked-button class="dt-btn dt-edit" *ngIf="isOneItemSelected()" (click)="onEdit()">
      <mat-icon>edit</mat-icon>
      {{ 'DATATABLE.EDIT' | translate }}
    </button>
    <button mat-stroked-button class="dt-btn" *ngIf="isOneItemSelected()" (click)="onView()">
      <mat-icon>visibility</mat-icon>
      {{ 'DATATABLE.VIEW' | translate }}
    </button>
    <button mat-stroked-button class="dt-btn dt-delete" *ngIf="selection.hasValue()" (click)="onDisable()">
      <mat-icon>delete</mat-icon>
      {{ 'DATATABLE.DELETE' | translate }}
    </button>
  </div>

  <mat-form-field appearance="outline" class="dt-search" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput (keyup)="applyFilter($event)" [placeholder]="'DATATABLE.FILTER_PLACEHOLDER' | translate" #input>
  </mat-form-field>
</div>

<div class="datatable-wrapper">
  <table mat-table [dataSource]="dataSource" matSort recycleRows class="datatable">
    <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()"
                        [aria-label]="checkboxLabel()">
        </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)"
                        [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
        </td>
    </ng-container>

    @for (column of columns; track column) {
        <ng-container [matColumnDef]="column.columnDef">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{column.header}}</th>
        <td mat-cell *matCellDef="let row">{{column.cell(row)}}</td>
        </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        [class.row-selected]="selection.isSelected(row)"></tr>

    <tr class="dt-no-data" *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        {{ 'DATATABLE.FILTER_PLACEHOLDER' | translate }} — aucun résultat
      </td>
    </tr>
  </table>
</div>
<mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>
