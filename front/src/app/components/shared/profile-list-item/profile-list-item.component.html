<mat-card class="student-card">
  <div class="student-card-content">
    <div class="student-avatar">
      <img *ngIf="profilePhotoUrl && !hasImageError; else avatarInitials" [appSecureImage]="profilePhotoUrl"
        [alt]="'PROFILE_CARD.PROFILE_PHOTO' | translate" class="profile-photo" (error)="onImageError()">
      <ng-template #avatarInitials>
        <div class="initials-avatar" [style.background-color]="avatarColor">{{ getInitials() }}</div>
      </ng-template>
    </div>
    <div class="student-info">
      <h2>{{ profile.firstName }} {{ profile.lastName }}</h2>
      <p>{{ profile.email }}</p>
    </div>
    <div class="student-contact">
      <button mat-icon-button
              color="primary"
              (click)="openEmail($event)"
              [matTooltip]="'PROFILE_CARD.SEND_EMAIL' | translate"
              [disabled]="!profile.email">
        <mat-icon>email</mat-icon>
      </button>
      <button mat-icon-button
              color="accent"
              (click)="openWhatsApp($event)"
              [matTooltip]="'PROFILE_CARD.OPEN_WHATSAPP' | translate"
              [disabled]="!profile.phoneNumber">
        <mat-icon>phone</mat-icon>
      </button>
    </div>
  </div>
</mat-card>
