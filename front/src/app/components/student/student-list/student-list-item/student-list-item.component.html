<mat-card class="student-card"
  [class.status-late-bg]="paymentStatus?.paymentStatus === 'LATE'"
  [class.status-good-bg]="paymentStatus?.paymentStatus === 'GOOD'"
  [class.status-exempt-bg]="paymentStatus?.paymentStatus === 'EXEMPT'">
  <mat-card-content>
    <div class="student-info">
      <div class="student-avatar">
        <img *ngIf="studentPhotoUrl && !hasImageError; else avatarInitials" [appSecureImage]="studentPhotoUrl"
          alt="Photo de l'étudiant" (error)="onImageError()" />
        <ng-template #avatarInitials>
          <div class="initials-avatar" [style.background-color]="avatarColor">{{ getInitials() }}</div>
        </ng-template>
      </div>
      <div
        class="student-details"
        tabindex="0"
        role="button"
        (click)="navigateToStudent(student)"
        (keyup.enter)="navigateToStudent(student)"
        (keyup.space)="navigateToStudent(student)"
      >
        <h4>{{ student.firstName }} {{ student.lastName }}</h4>
        <p>{{ student.email }}</p>
      </div>

      <!-- Statut de paiement : colonne alignée -->
      <div class="student-status">
        <mat-chip
          *ngIf="paymentStatus && paymentStatus.paymentStatus !== 'NA'"
          [class.status-good]="paymentStatus.paymentStatus === 'GOOD'"
          [class.status-late]="paymentStatus.paymentStatus === 'LATE'"
          [class.status-exempt]="paymentStatus.paymentStatus === 'EXEMPT'"
          [matTooltip]="getPaymentTooltip()"
          [matTooltipDisabled]="paymentStatus.paymentStatus !== 'LATE'"
          matTooltipClass="payment-tooltip"
          class="payment-status-chip">
          <mat-icon>{{ getPaymentIcon() }}</mat-icon>
          {{ getPaymentLabel() }}
        </mat-chip>
      </div>

      <div class="student-actions">
        <button
          mat-icon-button
          color="primary"
          matTooltip="Envoyer un email"
          (click)="openEmail($event)"
          [disabled]="!student.email"
        >
          <mat-icon>email</mat-icon>
        </button>
        <button
          mat-icon-button
          color="accent"
          matTooltip="Ouvrir WhatsApp"
          (click)="openWhatsApp($event)"
          [disabled]="!student.phoneNumber"
        >
          <mat-icon>phone</mat-icon>
        </button>
        <button
          *ngIf="showDeleteButton"
          mat-icon-button
          matTooltip="Supprimer l'étudiant du groupe"
          (click)="onDeleteStudent($event)"
          aria-label="Désactiver"
          class="disable-button"
        >
          <mat-icon>block</mat-icon>
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
