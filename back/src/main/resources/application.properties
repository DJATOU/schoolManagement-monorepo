# Database Configuration
# Uses environment variables if set, otherwise defaults to local PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schoolManagement4}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
# Le profil prod force 'validate' : en production, c'est Flyway qui fait évoluer
# le schéma, Hibernate se contente de vérifier qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=update

# ========================================
# FLYWAY — versionnement du schéma
# ========================================
# Le schéma est versionné dans src/main/resources/db/migration.
# Base vide      : V1__baseline.sql s'exécute et crée les tables.
# Base peuplée   : baseline-on-migrate pose un repère en version 1 et saute V1,
#                  donc les données existantes ne sont jamais touchées.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Un script déjà appliqué ne doit plus être modifié : on veut l'échec au
# démarrage plutôt qu'une divergence silencieuse entre les deux machines.
spring.flyway.validate-on-migrate=true

# ========================================
# ACTUATOR — sonde de disponibilité uniquement
# ========================================
# Seul /actuator/health est exposé, et sans détail : il sert à la sonde Docker
# pour que nginx n'envoie pas de trafic vers un backend pas encore prêt.
# Ce point d'accès n'est PAS publié sur l'hôte et n'est pas relayé par nginx :
# il n'est joignable que depuis le réseau interne Docker.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
