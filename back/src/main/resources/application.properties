# Database Configuration
# Uses environment variables if set, otherwise defaults to local PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schoolManagement4}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
#logging.level.org.springframework.security=DEBUG
#logging.level.com.school.management=DEBUG
# Afficher toutes les requêtes SQL
#spring.jpa.show-sql=true

# Pour un affichage plus détaillé (avec valeurs de paramètres)
#spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.type.descriptor.sql=trace
#ogging.level.org.hibernate.SQL=DEBUG
# Configuration des uploads d'images
# Utilise la variable d'environnement UPLOAD_DIR si définie, sinon utilise ./uploads/images
app.upload.dir=${UPLOAD_DIR:./uploads/images}

# Taille maximale des fichiers (10MB pour laisser de la marge aux photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# URL de base du serveur - utilisée pour générer les URLs des images
# Utilise la variable d'environnement SERVER_BASE_URL si définie
server.base-url=${SERVER_BASE_URL:http://localhost:8080}

# Chemin relatif pour les images (utilisé par ImageUrlService)
images.path=personne

# ========================================
# SÉCURITÉ — Authentification & Autorisation (JWT)
# ========================================
# Clé de signature JWT (HS256). AUCUNE valeur par défaut : l'absence de JWT_SECRET
# doit faire échouer le démarrage (fail-fast). Fournir via variable d'environnement.
security.jwt.secret=${JWT_SECRET}
# Durée de vie du jeton en millisecondes (défaut : 1 heure).
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Compte ADMIN initial (créé au premier démarrage si aucun ADMIN n'existe).
# Identifiant par défaut "admin" ; mot de passe requis via variable d'environnement.
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD}


logging.level.root=info
