# Configuration pour environnement de développement local

# Répertoire local pour les images en développement
app.upload.dir=./uploads/images

# URL du serveur en développement local
server.base-url=http://localhost:8080

# Logs plus verbeux en développement
logging.level.com.school.management=DEBUG
logging.level.org.springframework.web=DEBUG

# Afficher les requêtes SQL en développement
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# SÉCURITÉ — valeurs par défaut DEV UNIQUEMENT
# ========================================
# En dev, l'application démarre sans configurer de variables d'environnement.
# Ces valeurs restent surchargeables via JWT_SECRET / ADMIN_PASSWORD.
# ⚠ En production (profil prod), aucune valeur par défaut : JWT_SECRET est OBLIGATOIRE (fail-fast).
security.jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me-0123456789-abcdefghijklmnop}
security.admin.username=${ADMIN_USERNAME:admin}
security.admin.password=${ADMIN_PASSWORD:admin123}
