# Configuration pour environnement de production

# Database Configuration - REQUIRED environment variables for production
# These will be provided by your hosting platform (e.g., Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Répertoire de stockage des photos, toujours fourni par UPLOAD_DIR.
# La valeur par défaut correspond au point de montage utilisé dans l'image Docker
# (docker-compose y monte un dossier de l'hôte, ce qui rend la sauvegarde des
# photos aussi simple qu'une copie de dossier vers une clé USB).
app.upload.dir=${UPLOAD_DIR:/app/uploads/images}

# URL de base utilisée pour fabriquer les URLs des photos.
# Valeur par défaut VIDE, volontairement : le front et l'API partagent une seule
# origine derrière nginx, donc une URL relative ("/personne/photo.jpg") suffit et
# reste valable quelle que soit l'adresse IP ou le nom de la machine hôte.
# Renseigner SERVER_BASE_URL seulement si l'API doit un jour être servie depuis
# une origine distincte du front.
server.base-url=${SERVER_BASE_URL:}

# Taille maximale des fichiers en production
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Logs en production (moins verbeux)
logging.level.com.school.management=INFO
logging.level.org.springframework.web=WARN

# Pas de logs SQL en production
spring.jpa.show-sql=false

# En production, utiliser 'validate' ou 'none' pour éviter les modifications automatiques de schema
spring.jpa.hibernate.ddl-auto=validate

# ========================================
# FLYWAY — pas de baseline implicite en production
# ========================================
# La configuration générale active baseline-on-migrate pour le poste de
# développement, dont la base existait avant l'introduction de Flyway.
# Sur une cible de déploiement neuve, ce réglage est dangereux : si le schéma
# n'est pas parfaitement vide au premier passage, Flyway pose un repère en
# version 1 et SAUTE V1__baseline.sql, donc ne crée aucune table. L'erreur
# n'apparaît qu'à la migration suivante, sous la forme trompeuse d'une
# relation manquante (« relation "refund" does not exist »), très loin de sa
# cause réelle.
# À false, les deux cas deviennent lisibles : schéma vide, les migrations
# s'exécutent depuis V1 ; schéma non vide sans historique, le démarrage échoue
# immédiatement en désignant le vrai problème.
spring.flyway.baseline-on-migrate=false
