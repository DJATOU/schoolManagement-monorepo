# Configuration de test (le classpath de test masque le application.properties principal :
# on y reproduit donc la config applicative nécessaire au démarrage du contexte, SANS la
# datasource — les tests d'intégration fournissent la leur (H2) via @TestPropertySource /
# @DataJpaTest).

# --- Sécurité (feature authentication-authorization) : valeurs de test ---
security.jwt.secret=test-secret-please-change-0123456789-abcdefghijklmnop
security.jwt.expiration-ms=3600000
security.admin.username=admin
security.admin.password=test-admin-password

# --- Config applicative requise par certains beans au démarrage ---
server.base-url=http://localhost:8080
images.path=personne
app.upload.dir=./uploads/images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

logging.level.root=warn
